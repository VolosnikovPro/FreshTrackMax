services:
  backend:
    build:
      context: backend
      network: host
    depends_on:
      - db
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@db:5432/mydb
    volumes:
      # we need to store telegram session bc else bot can't check channel subscriptions (need to re-add bot to channel in such case)
      - ./tg_session:/code/session
    env_file:
      - .env
  frontend:
    build:
      context: frontend
      network: host
    depends_on:
      - backend
    restart: always
  max-bot:
    build:
      context: max-bot
      network: host
    restart: always
    env_file:
      - .env
  db:
    image: postgres:alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    volumes:
      - ./pgdata:/var/lib/postgresql:rw
  nginx:
    image: nginx:mainline
    restart: always
    depends_on:
      - backend
      - frontend
    ports:
      - 80:80
      - 443:443
      - 3000:3000
    volumes:
      - ./configs:/etc/nginx/http_configs.d:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./cert:/cert:ro
